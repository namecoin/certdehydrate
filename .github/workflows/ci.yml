name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Go Lint ${{ matrix.goos }} ${{ matrix.lint.name }}
    runs-on: ubuntu-24.04
    container: golang:latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - windows
        lint:
          - name: New
            args: >-
              --new-from-rev=HEAD~
              --enable=cyclop,dupword,embeddedstructfieldcheck,err113,errcheck,exhaustive,forcetypeassert,funlen,gocognit,goconst,gocritic,godoclint,godot,gosec,govet,ineffassign,mnd,modernize,nakedret,nlreturn,staticcheck,unconvert,unparam,unused,wastedassign,wsl_v5
          - name: Mandatory
            args: >-
              --enable=asasalint,asciicheck,bidichk,bodyclose,canonicalheader,decorder,dupl,durationcheck,errchkjson,errname,exptostd,gocheckcompilerdirectives,goprintffuncname,misspell,predeclared,usestdlibvars
              --disable=errcheck,govet,ineffassign,staticcheck,unused
          - name: Full
            args: >-
              --issues-exit-code=0
              --enable=cyclop,dupword,embeddedstructfieldcheck,err113,errcheck,exhaustive,forcetypeassert,funlen,gocognit,goconst,gocritic,godoclint,godot,gosec,govet,ineffassign,mnd,modernize,nakedret,nlreturn,staticcheck,unconvert,unparam,unused,wastedassign,wsl_v5
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libcap-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Trust repository
        run: git config --global --add safe.directory "$PWD"
      - name: Prepare Go module
        run: bash testdata/prepare_go_module.bash
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ${{ matrix.lint.args }} -v --timeout=5m --output.json.path=lint-report.json
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-${{ matrix.goos }}-${{ matrix.lint.name }}
          path: lint-report.json
          if-no-files-found: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y git ShellCheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: bash testdata/shellcheck.bash

  unit-tests:
    name: Unit Tests ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go latest
            image: golang:latest
            package_manager: apt
            install_go_package: false
          - name: Debian testing
            image: debian:testing
            package_manager: apt
            install_go_package: true
          - name: Debian unstable
            image: debian:unstable
            package_manager: apt
            install_go_package: true
          - name: Fedora latest
            image: fedora:latest
            package_manager: dnf
            install_go_package: true
          - name: Fedora rawhide
            image: fedora:rawhide
            package_manager: dnf
            install_go_package: true
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        if: matrix.package_manager == 'apt'
        run: |
          apt-get update
          apt-get install -y libcap-dev
      - name: Install dependencies
        if: matrix.package_manager == 'dnf'
        run: dnf install -y libcap-devel
      - name: Install Go compiler
        if: matrix.package_manager == 'apt' && matrix.install_go_package
        run: |
          apt-get update
          apt-get install -y build-essential git golang
      - name: Install Go compiler
        if: matrix.package_manager == 'dnf' && matrix.install_go_package
        run: dnf install -y git golang
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust repository
        run: git config --global --add safe.directory "$PWD"
      - name: Prepare Go module
        run: bash testdata/prepare_go_module.bash
      - name: Test
        run: |
          gopath="$(go env GOPATH)"
          nctestsuite_path="$(go list -m -f '{{.Dir}}' github.com/hlandau/nctestsuite)"
          mkdir -p "$gopath/src/github.com/hlandau/nctestsuite"
          cp "$nctestsuite_path/testsuite.txt" "$gopath/src/github.com/hlandau/nctestsuite/"
          export GOPATH="$gopath"
          go install -v ./...
          go test -v ./...

  cross-compile:
    name: Cross-Compile Go latest ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: golang:latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux_amd64
          - linux_386
          - linux_arm
          - linux_arm64
          - linux_ppc64le
          - darwin_amd64
          - freebsd_386
          - freebsd_amd64
          - freebsd_arm
          - linux_ppc64
          - openbsd_386
          - openbsd_amd64
          - netbsd_386
          - netbsd_amd64
          - netbsd_arm
          - dragonfly_amd64
          - solaris_amd64
          - windows_386
          - windows_amd64
        include:
          - target: linux_amd64
            cgo_enabled: 1
            packages: libcap-dev
          - target: linux_386
            cgo_enabled: 1
            cc: i686-linux-gnu-gcc
            dpkg_architecture: i386
            packages: gcc-i686-linux-gnu libc6-dev:i386 libcap-dev:i386
          - target: linux_arm
            cgo_enabled: 1
            cc: arm-linux-gnueabihf-gcc
            dpkg_architecture: armhf
            packages: gcc-arm-linux-gnueabihf libc6-dev:armhf libcap-dev:armhf
          - target: linux_arm64
            cgo_enabled: 1
            cc: aarch64-linux-gnu-gcc
            dpkg_architecture: arm64
            packages: gcc-aarch64-linux-gnu libc6-dev:arm64 libcap-dev:arm64
          - target: linux_ppc64le
            cgo_enabled: 1
            cc: powerpc64le-linux-gnu-gcc
            dpkg_architecture: ppc64el
            packages: gcc-powerpc64le-linux-gnu libc6-dev:ppc64el libcap-dev:ppc64el
    steps:
      - name: Install dependencies
        if: matrix.cgo_enabled
        env:
          DPKG_ARCHITECTURE: ${{ matrix.dpkg_architecture }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [[ -n "$DPKG_ARCHITECTURE" ]]; then
            dpkg --add-architecture "$DPKG_ARCHITECTURE"
          fi
          apt-get update
          read -r -a packages <<< "$PACKAGES"
          apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust repository
        run: git config --global --add safe.directory "$PWD"
      - name: Prepare Go module
        run: bash testdata/prepare_go_module.bash
      - name: Build
        env:
          CC: ${{ matrix.cc || 'gcc' }}
          CGO_ENABLED: ${{ matrix.cgo_enabled || '0' }}
          TARGET: ${{ matrix.target }}
        run: |
          release_tag=
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi

          target_os="${TARGET%_*}"
          target_arch="${TARGET#*_}"
          output="idist/ncdns-${release_tag}-${TARGET}/bin"
          mkdir -p "$output"
          GOOS="$target_os" GOARCH="$target_arch" go build -v -o "$output/" ./...

          bash testdata/dist.bash
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
